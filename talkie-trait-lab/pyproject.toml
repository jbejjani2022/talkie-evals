[project]
name = "talkie-trait-lab"
version = "0.1.0"
description = "Standalone Talkie Vintage/Web LoRA and raw-answer TRAIT experiments"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.9.0", "transformers==4.57.6", "tiktoken==0.14.0",
  "huggingface-hub==0.36.2", "safetensors==0.8.0",
  "numpy==2.2.6", "pyarrow==25.0.1", "datasets==5.0.1", "pyyaml>=6,<7",
]

[project.scripts]
trait-lab = "trait_lab.cli:main"
behavior-evals = "behavior_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trait_lab", "src/talkie_base_experiments", "src/behavior_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
